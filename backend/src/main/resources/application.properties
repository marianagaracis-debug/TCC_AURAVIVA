spring.application.name=auraviva

# ============================================================
# Arquivo .env (opcional)
# O Spring carrega o .env da pasta backend/ sozinho, tanto rodando de dentro
# de backend/ quanto da raiz do projeto. Variaveis aceitas:
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD, CORS_ORIGINS,
#   MAIL_USER, MAIL_PASSWORD, CODIGO_FUNCIONARIO, SESSION_SAMESITE, SESSION_SECURE
# ============================================================
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties]

# ============================================================
# Banco de dados SQL Server (Somee)
# Pegue host, nome do banco, usuario e senha no painel do Somee
# (SQL Server > seu banco) e coloque no arquivo backend/.env
# ============================================================
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:bd_auraviva_2x};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Codigo que o funcionario informa na aba "Funcionario" do cadastro.
# TROQUE por um valor seu (CODIGO_FUNCIONARIO no .env).
auraviva.codigo-funcionario=${CODIGO_FUNCIONARIO:AURAVIVA-FUNC-2026}

# Cookie de sessao: se o site (front) e a API ficarem em dominios diferentes
# e em HTTPS, use SESSION_SAMESITE=None e SESSION_SECURE=true
server.servlet.session.cookie.same-site=${SESSION_SAMESITE:lax}
server.servlet.session.cookie.secure=${SESSION_SECURE:false}

#spring.jpa.show-sql=true
#spring.jpa.hibernate.format_sql=true
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ============================================================
# E-mail (recuperacao de senha). Opcional: sem MAIL_USER/MAIL_PASSWORD
# o sistema funciona normalmente, apenas o e-mail do codigo nao e enviado.
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# CORS - origens do frontend React (Vite), separadas por virgula
# ============================================================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
